<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} - {{ site.Title }}{{ end }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "styles.css" | relURL }}">
</head>
<body>
  {{ partial "site-nav.html" . }}
  <div class="ambient-glows"><div class="glow-blob blob-primary"></div><div class="glow-blob blob-secondary"></div></div>
  <div class="global-mouse-glow" id="global-mouse-glow"></div>
  <div class="reading-progress" aria-hidden="true"><span class="reading-progress-value"></span></div>
  {{ block "main" . }}{{ end }}
  {{ partial "site-footer.html" . }}
  <button class="scroll-to-top" type="button" aria-label="Scroll to top"><i data-lucide="arrow-up" aria-hidden="true"></i></button>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="{{ "script.js" | relURL }}"></script>
  {{ if eq .Section "articles" }}<script src="{{ "reader.js" | relURL }}"></script>{{ end }}
</body>
</html>
