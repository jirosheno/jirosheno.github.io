<section class="article-reader" data-article-reader aria-label="Listen to this article">
  <div class="reader-wave" data-reader-wave aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="reader-content">
    <div class="reader-header">
      <div class="reader-info">
        <span class="reader-icon"><i data-lucide="volume-2" aria-hidden="true"></i></span>
        <div><span class="reader-label">LISTEN TO ARTICLE</span><span class="reader-status" data-reader-status>Ready to play</span></div>
      </div>
      <div class="reader-actions">
        <button class="reader-mute" type="button" data-reader-mute aria-label="Mute audio"><i data-lucide="volume-2" aria-hidden="true"></i></button>
        <button class="reader-play" type="button" data-reader-play aria-label="Play article audio"><i data-lucide="play" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="reader-progress">
      <span data-reader-current>0:00</span>
      <input type="range" data-reader-progress min="0" max="100" value="0" step="0.1" aria-label="Audio progress">
      <span data-reader-remaining>-0:00</span>
    </div>
    <div class="reader-time-info">
      <span><span class="reader-time-label">ELAPSED</span><span data-reader-elapsed>0:00</span></span>
      <span class="reader-time-separator">/</span>
      <span><span class="reader-time-label">TOTAL</span><span data-reader-duration>--:--</span></span>
      <span><span class="reader-time-label">REMAINING</span><span data-reader-remaining-bottom>-0:00</span></span>
    </div>
    <div class="reader-controls" aria-label="Playback speed">
      <button type="button" data-speed="0.75">0.75×</button><button type="button" data-speed="1" class="active">1×</button><button type="button" data-speed="1.25">1.25×</button><button type="button" data-speed="1.5">1.5×</button><button type="button" data-speed="2">2×</button>
    </div>
  </div>
</section>
