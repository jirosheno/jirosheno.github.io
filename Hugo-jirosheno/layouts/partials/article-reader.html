<section class="article-reader" data-article-reader aria-label="Listen to this article">
  <div class="reader-header">
    <div class="reader-info">
      <span class="reader-icon"><i data-lucide="volume-2" aria-hidden="true"></i></span>
      <div><span class="reader-label">LISTEN TO ARTICLE</span><span class="reader-status" data-reader-status>Ready to read</span></div>
    </div>
    <button class="reader-play" type="button" data-reader-play aria-label="Play article"><i data-lucide="play" data-reader-icon aria-hidden="true"></i></button>
  </div>
  <div class="reader-progress"><span data-reader-current>0:00</span><input type="range" data-reader-progress min="0" max="100" value="0" step="1" aria-label="Article audio progress"><span data-reader-duration>--:--</span></div>
  <div class="reader-controls" aria-label="Playback speed"><button type="button" data-speed="0.75">0.75×</button><button type="button" data-speed="1" class="active">1×</button><button type="button" data-speed="1.25">1.25×</button><button type="button" data-speed="1.5">1.5×</button><button type="button" data-speed="2">2×</button></div>
</section>
